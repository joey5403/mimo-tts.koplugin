name: Release

# Release flow: versions and changelogs are generated automatically.
#
#   * push a v* tag          -> build + publish the release for that tag
#   * run with a `bump`      -> compute the next version (patch/minor/major),
#                               create the tag; the tag push then runs the
#                               build + publish job above
#
# The artifact carries the version stamped into mimo_version.lua at build
# time (single source of truth: git tags); notes are generated from the git
# history by tools/release-notes.py.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (the version number and tag are generated automatically)"
        type: choice
        options: [ patch, minor, major ]
        default: patch

permissions:
  contents: write

jobs:
  # generate version + tag (dispatch only); the pushed tag triggers `release`
  cut-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags are needed for the version calculation

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(sh tools/next-version.sh "${{ inputs.bump }}")
          git tag -a "v$V" -m "MiMo TTS Read-aloud v$V"
          git push origin "v$V"
          echo "cut-release: tagged v$V -- the release job will publish it"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags are needed for the changelog ranges
          ref: ${{ github.ref_name }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit gettext zip

      - name: Build release zip
        # tools/release.sh: stamps mimo_version.lua from the tag, runs the
        # syntax/catalog checks, generates notes and builds dist/*.zip
        run: make release

      - name: Prepare release notes
        run: |
          python3 tools/release-notes.py "${GITHUB_REF_NAME}" > /tmp/notes.md 2>/dev/null \
            || echo "See the commit history for changes." > /tmp/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="MiMo TTS Read-aloud $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TITLE" --notes-file /tmp/notes.md
          fi
