name: Feature request / 功能建议
description: Suggest an idea or improvement / 提出想法或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome — especially ones that make listening better on e-ink.
        欢迎任何让"电子书听书"体验更好的想法。

  - type: textarea
    id: problem
    attributes:
      label: Problem / 需求场景
      description: What problem does this solve? What is the use case? / 这个功能解决什么问题？使用场景是什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 期望的方案
      description: How should it work? / 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 备选方案
      description: Any workarounds or alternative designs you have considered. / 你考虑过的替代做法。

  - type: dropdown
    id: platform
    attributes:
      label: Platform(s) affected / 涉及平台
      multiple: true
      options:
        - Android
        - Kindle
        - Kobo
        - PocketBook
        - reMarkable
        - Desktop Linux
        - macOS
        - Windows (WSL)
        - All platforms / 全平台

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution / 参与意愿
      options:
        - label: I'd like to help implement this / 我愿意参与实现
